<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Градиент для подложки куба (стилистика 1С) -->
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <!-- Градиент для акцентов -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Иконка: Стилизованный куб конфигурации / Знак качества -->
    <!-- Основная желтая фигура -->
    <path d="M 40 0 L 75 20 L 75 60 L 40 80 L 5 60 L 5 20 Z" fill="url(#cubeGrad)" />
    <!-- Грани куба для объема -->
    <path d="M 40 0 L 40 40 L 5 20 M 40 40 L 75 20" fill="none" stroke="#FFA000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Красная динамичная галочка / элемент вершины (символ успешной сдачи и ИТ) -->
    <path d="M 25 42 L 37 52 L 65 22" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Маленькая звездочка "Специалист" -->
    <polygon points="40,12 43,18 50,19 45,24 46,31 40,27 34,31 35,24 30,19 37,18" fill="#FFF" />
  </g>

  <!-- Текстовая часть -->
  <!-- Главное название -->
  <text x="105" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#263238" letter-spacing="0.5">
    1С:СПЕЦИАЛИСТ
  </text>
  
  <!-- Подзаголовок -->
  <text x="105" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E53935" letter-spacing="3">
    КУРС ПОДГОТОВКИ
  </text>

  <!-- Декоративная ИТ-линия кода/разделитель -->
  <path d="M 105 54 L 380 54" fill="none" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="4 4" />
</svg>